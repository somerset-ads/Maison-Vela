<svg width="1920" height="1200" viewBox="0 0 1920 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#69715E"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#bgAH)"/>

  <!-- hanging hides in a tannery -->
  <g opacity="0.9">
    <rect x="260" y="140" width="140" height="680" rx="24" fill="#69715E" opacity="0.5"/>
    <rect x="460" y="180" width="140" height="640" rx="24" fill="#BDA57A" opacity="0.45"/>
    <rect x="660" y="120" width="140" height="700" rx="24" fill="#DCCDB8" opacity="0.4"/>
    <rect x="1120" y="160" width="140" height="660" rx="24" fill="#DCCDB8" opacity="0.4"/>
    <rect x="1320" y="130" width="140" height="690" rx="24" fill="#BDA57A" opacity="0.45"/>
    <rect x="1520" y="180" width="140" height="640" rx="24" fill="#69715E" opacity="0.5"/>
  </g>

  <!-- rail -->
  <line x1="180" y1="140" x2="1740" y2="140" stroke="#F8F6F2" stroke-width="4" opacity="0.3"/>

  <!-- floor light beam -->
  <polygon points="900,860 1020,860 1200,1200 720,1200" fill="#F8F6F2" opacity="0.06"/>
</svg>
