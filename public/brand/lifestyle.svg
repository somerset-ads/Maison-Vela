<svg width="1200" height="1400" viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#69715E"/>
      <stop offset="100%" stop-color="#232323"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1400" fill="url(#bg2)"/>

  <!-- sun low -->
  <circle cx="600" cy="820" r="170" fill="#BDA57A" opacity="0.9"/>
  <line x1="0" y1="900" x2="1200" y2="900" stroke="#F8F6F2" stroke-width="2" opacity="0.35"/>

  <!-- arch doorway frame, foreground -->
  <path d="M120,1400 L120,560 Q600,260 1080,560 L1080,1400"
        fill="none" stroke="#F8F6F2" stroke-width="6" opacity="0.55"/>

  <!-- espresso cup + steam, bottom-left third -->
  <g transform="translate(300,1080)" stroke="#F8F6F2" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M-70,0 Q-70,60 0,60 Q70,60 70,0 Z"/>
    <path d="M70,10 Q110,10 110,35 Q110,60 70,50"/>
    <line x1="-70" y1="0" x2="70" y2="0"/>
    <path d="M-20,-40 Q-30,-60 -20,-80" opacity="0.5"/>
    <path d="M15,-40 Q5,-60 15,-80" opacity="0.5"/>
  </g>

  <!-- olive branch, top right -->
  <g transform="translate(880,260)" stroke="#F8F6F2" stroke-width="3" fill="#F8F6F2" opacity="0.5">
    <line x1="0" y1="0" x2="140" y2="60" stroke-linecap="round"/>
    <ellipse cx="30" cy="10" rx="20" ry="9" transform="rotate(20 30 10)"/>
    <ellipse cx="65" cy="25" rx="20" ry="9" transform="rotate(20 65 25)"/>
    <ellipse cx="100" cy="42" rx="20" ry="9" transform="rotate(20 100 42)"/>
    <ellipse cx="135" cy="58" rx="18" ry="8" transform="rotate(20 135 58)"/>
  </g>
</svg>
